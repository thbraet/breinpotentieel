<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Fasen van een actiepotentiaal</title>
  <desc id="desc">Grafiek van membraanpotentiaal door de tijd met rust, drempel, depolarisatie, piek, repolarisatie en hyperpolarisatie.</desc>
  <defs>
    <linearGradient id="plotBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102238"/><stop offset="1" stop-color="#081522"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="560" rx="24" fill="url(#plotBg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="56" y="50" fill="#eef7f6" font-size="25" font-weight="700">Actiepotentiaal: spanning door de tijd</text>
    <text x="56" y="78" fill="#9fb0ba" font-size="15">Typische waarden zijn benaderingen; neuron- en kanaaltype maken verschil.</text>
    <g stroke="#31465a" stroke-width="1">
      <path d="M100 130H940M100 245H940M100 320H940M100 410H940"/>
      <path d="M100 105V465M260 105V465M420 105V465M580 105V465M740 105V465M900 105V465" opacity=".45"/>
    </g>
    <path d="M100 105V465H940" fill="none" stroke="#91a2ad" stroke-width="2"/>
    <g fill="#9fb0ba" font-size="14" text-anchor="end">
      <text x="88" y="135">+30 mV</text><text x="88" y="250">−55 mV</text><text x="88" y="325">−70 mV</text><text x="88" y="415">−80 mV</text>
    </g>
    <text x="38" y="315" fill="#9fb0ba" font-size="14" transform="rotate(-90 38 315)">membraanpotentiaal</text>
    <text x="850" y="505" fill="#9fb0ba" font-size="14">tijd →</text>
    <path d="M100 245H940" stroke="#ffbd66" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="926" y="234" fill="#ffbd66" font-size="13" text-anchor="end">drempel</text>
    <path d="M105 320 C185 320 215 320 250 315 C286 310 300 283 320 247 C350 190 382 112 420 126 C447 138 454 230 480 282 C510 340 560 365 622 388 C675 408 724 360 770 325 C812 316 870 320 935 320" fill="none" stroke="#65d6c4" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="320" cy="247" r="8" fill="#ffbd66"/><circle cx="420" cy="126" r="8" fill="#ff776d"/><circle cx="622" cy="388" r="8" fill="#6aa9ff"/>
    <g font-size="15" font-weight="700">
      <text x="125" y="354" fill="#eef7f6">rust</text>
      <text x="258" y="218" fill="#ffbd66">drempel bereikt</text>
      <text x="350" y="170" fill="#65d6c4" transform="rotate(-63 350 170)">depolarisatie</text>
      <text x="441" y="155" fill="#ff776d">piek</text>
      <text x="500" y="220" fill="#65d6c4" transform="rotate(55 500 220)">repolarisatie</text>
      <text x="610" y="430" fill="#6aa9ff">hyperpolarisatie</text>
    </g>
    <g>
      <rect x="180" y="455" width="270" height="38" rx="19" fill="#65d6c4" opacity=".13"/>
      <text x="315" y="480" fill="#8ce5d7" font-size="14" text-anchor="middle">Naᵥ open → Na⁺ naar binnen</text>
      <rect x="456" y="455" width="285" height="38" rx="19" fill="#6aa9ff" opacity=".14"/>
      <text x="598" y="480" fill="#a7c9ff" font-size="14" text-anchor="middle">Kᵥ open → K⁺ naar buiten</text>
    </g>
    <g transform="translate(748 116)">
      <rect width="190" height="96" rx="14" fill="#142a40" stroke="#304b61"/>
      <text x="16" y="26" fill="#ffbd66" font-size="13" font-weight="700">REFRACTAIRE PERIODE</text>
      <text x="16" y="50" fill="#b9c6cc" font-size="13">Naᵥ-kanalen herstellen;</text>
      <text x="16" y="70" fill="#b9c6cc" font-size="13">onmiddellijk opnieuw vuren</text>
      <text x="16" y="88" fill="#b9c6cc" font-size="13">is tijdelijk onmogelijk/moeilijker.</text>
    </g>
  </g>
</svg>
