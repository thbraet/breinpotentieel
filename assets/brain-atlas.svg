  <title id="title">Schematische atlas van hersenkwabben en diepe structuren</title>
  <desc id="desc">Links een zijaanzicht met frontale, pariëtale, temporale en occipitale kwab en cerebellum. Rechts een mediaal aanzicht met corpus callosum, thalamus, hypothalamus, hippocampus, amygdala en hersenstam.</desc>
